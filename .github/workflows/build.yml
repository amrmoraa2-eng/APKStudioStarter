name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'APKStudioStarter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -o APKStudioStarter.zip -d project

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            echo "Project files:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APKStudio-debug
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
